  - case_id: EC-AUDIO-RIGHTS
    risk_class: HIGH
    prompt: 외부 생성 BGM을 상용 후보로 등록하는 권리·기술 검토를 수행하라.
    expected: [상용 사용권과 출처를 확인한다, 루프와 포맷과 라우드니스를 검증한다]
    forbidden: [검토 없이 배포 자산으로 지정한다]
