    risk_class: MEDIUM
    prompt: 룰렛 스핀·감속·결과·보상 단계의 사운드 큐 명세를 작성하라.
    expected: [이벤트와 재생 조건을 매핑한다, 동시재생과 음량 기준을 정의한다]
