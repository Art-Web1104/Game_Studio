schema_version: 1.0.0
contract_id: R2-LOAD-001
task_ref: tasks/R2-LOAD-0004.json
status: SUBMITTED_PENDING_REVIEW
summary: >-
  R2-LOAD-0004 유계 로컬 동시 부하 관측의 발행 계약이다. 이 유닛은 새 HTTP 경로도, 새 런타임
  모듈도, 서버 공개 API 변경도 만들지 않는다. 관측 대상은 저장소에 이미 존재하는 단일 사용자
  루프백 룰렛 참조 슬라이스이며, 하네스 scripts/observe_r2_load.py는 그 슬라이스를 밖에서
  두드릴 뿐 안에 계측을 심지 않는다. 이 파일은 두 가지를 분리해 선언한다. 첫째는 판정 대상인
  정확성 속성이고 둘째는 판정 대상이 아닌 관측치다. 관측치에는 어떤 임계값도, 목표치도, 용량
  약속도 붙지 않는다. tests/test_load_observation.py가 이 파일의 선언값과 하네스 상수를 실제로
  대조하므로, 여기 적힌 값과 구현이 어긋나면 시험이 실패한다.

# ---------------------------------------------------------------------------------------
# 1. 실행 안전 경계
# ---------------------------------------------------------------------------------------
# 아래 네 값은 로컬 실행이 무한정 늘어나지 않도록 묶는 안전 상한이다. 성능 기대치가 아니고,
# 통과·실패 임계값이 아니며, 어떤 관측 수치도 이 값과 비교해 판정되지 않는다. 후속 문서가 이
# 값을 용량 목표치로 인용하는 것은 이 계약이 명시적으로 거부하는 재해석이다.
safety_bounds:
  purpose: bounded_local_execution_only
  are_performance_expectations: false
  are_service_level_objectives: false
  are_pass_fail_thresholds: false
  compared_against_observed_values: false
  max_concurrency: 16
  max_total_requests: 128
  max_rounds: 32
  max_wall_seconds: 60
  enforcement: >-
    scripts/observe_r2_load.py의 ObservationConfig.validate()가 상한을 넘는 설정을
    LoadObservationError로 거절한다. 거절은 실행 전에 일어나며 부분 실행을 남기지 않는다.
  harness_constants_source: scripts.observe_r2_load
  harness_constant_names:
    max_concurrency: MAX_CONCURRENCY
    max_total_requests: MAX_TOTAL_REQUESTS
    max_rounds: MAX_ROUNDS
    max_wall_seconds: MAX_WALL_SECONDS

# 구현 기본값은 상한보다 낮다. 낮은 것은 허용되고 넘는 것은 허용되지 않는다.
defaults:
  are_lower_than_bounds: true
  may_exceed_bounds: false
  concurrency: 4
  rounds: 3
  warmup_requests: 2
  wall_timeout_seconds: 30
  stake_units_per_bet: 5
  opening_player_units: 10000
  opening_house_units: 1000000
  harness_constant_names:
    concurrency: DEFAULT_CONCURRENCY
    rounds: DEFAULT_ROUNDS
    warmup_requests: DEFAULT_WARMUP_REQUESTS
    wall_timeout_seconds: DEFAULT_WALL_SECONDS

# 계획 요청 수는 설정에서 유도되며, 유도된 값이 max_total_requests를 넘으면 실행이 거절된다.
request_plan:
  formula: warmup_requests + rounds * (2 * concurrency + 1)
  per_round_phases:
    - {phase: bets, requests: concurrency, method: POST, path: /api/bets, request_ids: distinct}
    - {phase: spin, requests: concurrency, method: POST, path: /api/spin, request_ids: identical}
    - {phase: new_round, requests: 1, method: POST, path: /api/new-round, request_ids: distinct}
  warmup_phase: {requests: warmup_requests, method: GET, path: /api/state, concurrent: false}
  checked_before_execution: true

# ---------------------------------------------------------------------------------------
# 2. 대상 바인딩
# ---------------------------------------------------------------------------------------
target_binding:
  bind: loopback_only
  allowed_hosts:
    - 127.0.0.1
    - ::1
    - localhost
    - ip6-localhost
  allowed_hosts_source: apps.roulette_web.server.LOOPBACK_HOSTS
  non_loopback_target: rejected
  external_network: prohibited
  production_target: prohibited
  remote_host_resolution: not_attempted
  target_slice: apps/roulette_web
  new_http_routes: 0
  new_runtime_modules: 0
  routes_source: apps.roulette_web.server.ROUTES
  route_count: 4
  server_api_changed: false
  runtime_instrumentation_added: false
  stdlib_only: true
  new_external_dependencies: 0
  package_installation: none
  build_step: none
  service_startup_outside_process: none

# ---------------------------------------------------------------------------------------
# 3. 판정 대상: 정확성 속성
# ---------------------------------------------------------------------------------------
# 아래 속성만이 시험의 단언 대상이다. 전부 타이밍에 의존하지 않으므로 기계 성능이 달라도
# 결과가 달라지지 않는다.
asserted_properties:
  - id: single_authoritative_draw_per_round
    statement: 라운드마다 정확히 하나의 권위 추첨 기록만 커밋된다.
    evidence: draw_record 건수와 라운드별 pocket·round_id 유일성
  - id: single_settlement_per_round
    statement: 라운드마다 정확히 하나의 정산 거래만 커밋된다.
    evidence: ledger_transaction 건수와 settlement_transaction_id 유일성
  - id: balance_delta_matches_ledger
    statement: 관측 종료 시점의 플레이어 잔액 델타 합이 원장 거래 합과 정수 최소 단위로 정확히 일치한다.
    evidence: 정수 동등성 단언
  - id: currency_is_integer_only
    statement: 통화 값에 부동소수가 사용되지 않는다.
    evidence: 원장 엔트리와 잔액의 정수 타입 검사
  - id: duplicate_request_id_commits_once
    statement: 같은 request_id의 동시 제출이 두 번째 추첨·엔트로피 소비·원장 거래·지급·잔액 변동을 만들지 않는다.
    evidence: 배리어 동기화된 실제 동시 제출과 엔트로피 소비 바이트 계측
  - id: duplicate_callers_observe_same_commit
    statement: 같은 request_id로 제출한 모든 호출자가 같은 커밋 결과를 관측한다.
    evidence: 응답의 settlement_transaction_id·pocket·round_id 일치와 replayed 플래그 분포
  - id: audit_refs_globally_unique
    statement: 부하 실행이 만든 모든 감사 이벤트가 전역 유일 참조를 갖는다.
    evidence: event_id·event_hash 유일성
  - id: audit_events_match_committed_rounds
    statement: 감사 이벤트가 유실이나 중복 없이 커밋된 라운드 수와 일치한다.
    evidence: ROULETTE_RNG_DRAW·ROULETTE_ROUND_SETTLED 건수 대조
  - id: audit_chain_verified_after_reload
    statement: 실행 종료 후 재적재한 감사 체인 검증이 문제 없음을 보고한다.
    evidence: studio_core.rng.verify_audit_chain 재실행
  - id: bounded_execution
    statement: 상한을 넘는 설정과 비루프백 대상은 실행 전에 거절된다.
    evidence: 네거티브 시험

# ---------------------------------------------------------------------------------------
# 4. 판정 대상이 아닌 관측치
# ---------------------------------------------------------------------------------------
observed_metrics:
  measurement_is_observation_only: true
  asserted_by_tests: false
  environment_dependent: true
  portable_performance_characteristic: false
  citation_requirement: >-
    이 수치를 인용하는 모든 문서는 그것이 특정 실행 환경의 관측 기록이라는 사실을 함께
    표기해야 한다. 값은 기계, 운영체제, 파이썬 버전, 동시에 돌고 있는 다른 부하에 따라 달라진다.
  items:
    - latency_ms.min
    - latency_ms.median
    - latency_ms.p95
    - latency_ms.max
    - throughput.requests_per_second
    - throughput.rounds_per_second
    - serialization_wait_proxy_ms.min
    - serialization_wait_proxy_ms.median
    - serialization_wait_proxy_ms.p95
    - serialization_wait_proxy_ms.max

# ---------------------------------------------------------------------------------------
# 5. 통계 산출 정의
# ---------------------------------------------------------------------------------------
# AC-006이 요구하는 네 가지를 여기서 확정한다: 중앙값과 p95의 산출 방법, 표본 수, 시계 소스,
# 워밍업 표본의 포함 여부. 산출 함수는 고정 표본에 대해 결정론적으로 검증된다.
statistics:
  unit: milliseconds
  clock_source: time.perf_counter
  clock_property: monotonic_highest_resolution_available_in_process
  clock_is_wall_clock: false
  rounding_decimals: 4
  method: nearest_rank_percentile
  interpolation: none
  index_formula: "index = ceil(percentile * n / 100) - 1, over the ascending sorted sample"
  index_arithmetic: integer_only
  median_definition: nearest_rank_percentile(50) over the ascending sorted sample
  p95_definition: nearest_rank_percentile(95) over the ascending sorted sample
  min_definition: first element of the ascending sorted sample
  max_definition: last element of the ascending sorted sample
  sample_population: measured request outcomes
  sample_count_field: samples
  warmup_requests_included_in_statistics: false
  warmup_requests_counted_in_total_requests: true
  warmup_requests_field: counts.warmup_requests
  empty_sample_behavior: rejected_with_NO_SAMPLES
  deterministic_on_fixed_samples: true
  harness_function_names:
    percentile: nearest_rank_percentile
    summary: summarize_samples

# ---------------------------------------------------------------------------------------
# 6. 직렬화 대기 프록시
# ---------------------------------------------------------------------------------------
# AC-008. 이 항목의 핵심은 무엇을 재는지가 아니라 무엇을 재지 않는지다.
serialization_wait_proxy:
  metric_name: serialization_wait_proxy_ms
  reported_separately_from_total_latency: true
  separate_output_key: true
  is_proxy: true
  measures_internal_lock_acquisition_wait: false
  harness_instruments_internal_locks: false
  runtime_instrumentation_added_to_observed_code: false
  production_instrumentation: prohibited
  computed_only_inside: scripts/observe_r2_load.py
  observation_start: >-
    동기화 배리어가 풀린 시각. threading.Barrier의 action 콜백이 마지막 작업자가 도착한
    시점에 time.perf_counter()로 단 한 번 기록하는 공통 순간이며, 모든 작업자가 같은 값을 쓴다.
  observation_end: >-
    클라이언트가 그 요청의 응답 상태줄과 헤더를 다 읽은 시각. http.client.getresponse()가
    반환하는 순간이며, 하네스가 프로세스 밖에서 관측할 수 있는 가장 이른 '서비스되었다' 신호다.
  combines:
    - operating_system_scheduler_wakeup_effects
    - client_thread_dispatch_order
    - loopback_connection_setup_and_transmission
    - serialized_service_effects
  does_not_isolate:
    - internal_lock_acquisition_wait
    - database_write_lock_wait
    - entropy_sampling_duration
  separation_from_total_latency: >-
    전체 요청 지연은 각 요청 자신의 송신 시각을 원점으로 재고, 이 프록시는 그룹 전체가 공유하는
    배리어 해제 시각 하나를 원점으로 잰다. 원점이 다르므로 두 값은 같은 것을 다르게 반올림한
    수치가 아니라 서로 다른 관측이며, 그룹 안에서 두 값의 차이가 벌어지는 모양이 직렬화된
    서비스 순서를 드러낸다.
  interpretation_limit: >-
    이 값을 내부 잠금 획득 대기 시간의 측정값으로 읽어서는 안 된다. 하네스는 그 대기를 직접
    계측하지 않으며, 그 값을 얻기 위해 관측 대상 런타임에 계측을 심는 방식은 채택하지 않는다.
  measured_only_for: barrier_released_concurrent_groups
  asserted_by_tests: false
  threshold: none
  upper_bound_semantics: >-
    관측 종점이 서비스 완료 신호이므로 이 프록시는 큐 대기의 상한이지 하한이 아니다. 서비스
    자체의 소요 시간이 값 안에 포함되어 있다.

# ---------------------------------------------------------------------------------------
# 7. 선언하지 않는 것
# ---------------------------------------------------------------------------------------
no_targets:
  service_level_objective_declared: false
  latency_threshold_declared: false
  throughput_target_declared: false
  capacity_promise_made: false
  release_capacity_commitment: false
  production_schedule_declared: false
  infrastructure_procurement: false
  external_or_production_load: false
  penetration_testing: false
  multi_user_identity_or_session_feature: false

# ---------------------------------------------------------------------------------------
# 8. 출력 계약
# ---------------------------------------------------------------------------------------
output_contract:
  format: json
  machine_readable: true
  top_level_keys:
    - schema_version
    - task_id
    - contract_ref
    - notice
    - environment
    - config
    - counts
    - elapsed
    - throughput
    - latency_ms
    - serialization_wait_proxy_ms
    - correctness
  environment_keys:
    - python_version
    - python_implementation
    - system
    - release
    - machine
    - cpu_count
    - clock_source
    - clock_resolution_ns
  contains_pii: false
  contains_credentials: false
  excluded_from_output:
    - hostname
    - username
    - account_identifier
    - email_address
    - credential_or_token_value
    - absolute_filesystem_path_of_the_operator
  entropy_material_recorded: false

# ---------------------------------------------------------------------------------------
# 9. 범위 밖
# ---------------------------------------------------------------------------------------
out_of_scope:
  - 용량 목표치(SLO)와 통과·실패 임계값 확정은 이 유닛이 하지 않는다.
  - 출시 용량 약속, 상용 제작 일정, 출시일은 R5 승인 이전이므로 확정하지 않는다.
  - 인프라 조달과 운영 규모 저장소 엔진 선택은 이 유닛이 다루지 않는다.
  - 외부·운영 환경을 대상으로 하는 부하는 수행하지 않는다. 관측은 루프백에만 한정된다.
  - R2-SEC-0005 침투 시험은 별개의 미승인 후보로 열린 채 남는다.
  - 다중 사용자 신원·세션 분리 기능은 이 유닛이 도입하지 않는다.
  - R4 산출물, 자산, 이미지, 아트 경로는 만들지도 수정하지도 검토하지도 않는다.

# ---------------------------------------------------------------------------------------
# 10. 동결 경로
# ---------------------------------------------------------------------------------------
frozen_paths:
  reason: >-
    tasks/R2-LOAD-0004.json이 아래 경로를 정규 LF 해시로 고정한다. 이 유닛은 저장소에 이미
    존재하는 어떤 파일도 수정하지 않으며, 특히 관측 대상 런타임과 scripts/validate_baseline.py를
    건드리지 않는다. 계약과 구현의 대조는 신규 파일 tests/test_load_observation.py 안에서 한다.
  modified_by_this_unit: 0
  paths:
    - apps/roulette_web/server.py
    - apps/roulette_web/table.py
    - studio_core/durable_state.py
    - studio_core/rng.py
    - studio_core/ledger.py
    - games/roulette/rng-contract.yaml
    - games/roulette/durable-state-contract.yaml
    - games/roulette/reconnect-contract.yaml
    - games/roulette/playable-slice-contract.yaml
    - games/roulette/round-state.yaml
    - games/roulette/ledger-transaction.schema.json
    - games/roulette/rng-draw-record.schema.json
    - tests/test_rng.py
    - tests/test_durable_state.py
    - tests/test_roulette_web_server.py
    - tests/test_roulette_web_ui.py
    - tests/test_reconnect_continuity.py
  also_unmodified:
    - scripts/validate_baseline.py
    - tasks/R4-ART-0007.json

new_files:
  - games/roulette/load-observation-contract.yaml
  - scripts/observe_r2_load.py
  - tests/test_load_observation.py
  - docs/games/R2-load-observation.md
  - docs/approvals/R2-LOAD-0004-validation-report.md
  - audit/events/R2-LOAD-0004-events.json
