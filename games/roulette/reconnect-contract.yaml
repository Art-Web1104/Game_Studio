schema_version: 1.0.0
contract_id: R2-RECONNECT-001
task_ref: tasks/R2-NET-0003.json
status: SUBMITTED_PENDING_REVIEW
summary: >-
  R2-NET-0003 재접속과 라운드 연속성의 발행 계약이다. 이 유닛은 새 HTTP 경로도, 새 런타임
  모듈도, 서버 공개 API 변경도 만들지 않는다. 권위 상태 재수화는 기존 GET /api/state로,
  정산 응답 유실 복구는 기존 POST /api/spin의 동일 request_id 재시도로 성립한다.
  scripts/validate_baseline.py::validate_r2_reconnect가 이 파일과 기존 구현 상수를
  대조하므로, 여기 적힌 값과 구현이 어긋나면 기준선 검증이 실패한다.

design:
  # 0과 false가 이 유닛의 핵심 주장이다. 검증기는 이 값들을 선언이 아니라 측정과 대조한다.
  new_http_routes: 0
  new_runtime_modules: 0
  server_api_changed: false
  server_constructor_changed: false
  rehydration_endpoint: /api/state
  rehydration_method: GET
  response_loss_recovery_endpoint: /api/spin
  response_loss_recovery_method: POST
  response_loss_recovery_key: request_id
  # apps/roulette_web 아래에 존재해도 되는 파이썬 모듈 전부. 실제 디렉터리 목록과 대조한다.
  runtime_modules:
    - __init__.py
    - server.py
    - table.py

authority:
  recovery_source: server_authoritative_durable_state
  client_authority: denied
  client_supplied_state_merged_on_reconnect: false
  client_computes_result: false
  client_computes_payout: false
  client_computes_balance: false
  client_source_of_randomness: none
  rejected_client_fields_source: apps.roulette_web.table.CLIENT_AUTHORITY_FIELDS
  rejected_client_field_refusal_code: CLIENT_AUTHORITY_DENIED

rehydration:
  source_of_truth: GET /api/state
  discards_local_state: true
  merges_local_state: false
  survives_server_restart: true
  # 재수화가 복원하는 값. 전부 서버가 조립하며 클라이언트가 계산하지 않는다.
  restored_fields:
    - balance_units
    - reserved_units
    - available_units
    - house_bankroll_units
    - round
    - recent_results
  recent_results_rebuilt_from: durable_audit_chain
  recent_results_rebuild_boundary: apps.roulette_web.table.RouletteTable.reload_history

betting_continuity:
  # apps.roulette_web.table.BETS_ACCEPTED_IN과 games/roulette/round-state.yaml의
  # guards.accept_bets_only_in에 동시에 대조한다.
  accept_bets_only_in: OPEN
  uncommitted_bets_durable: false
  bets_restored_on_reconnect: false
  client_drops_drafts_when_not_accepting_bets: true
  client_drops_drafts_when_round_changed: true
  post_open_bet_submission_refusal_code: PHASE_DENIED
  reserved_units_restored_from: server_snapshot_only

settlement_recovery:
  retry_uses_same_request_id: true
  # 같은 프로세스: RouletteTable의 요청 저널이 원본 응답을 그대로 재생한다.
  same_process_behavior: RETURN_ORIGINAL_RESULT
  same_process_replay_flag: replayed
  # 재시작 이후: 요청 저널은 비어 있고 새 라운드가 열려 있다. 어떤 코드로 거절되는지는 그 새
  # 라운드의 상태에 달려 있으며 셋 다 실패 폐쇄다.
  #   NO_BETS      새 라운드에 베팅이 없다. 테이블이 내구 저장소에 닿기 전에 막는다.
  #   DRAW_DENIED  새 라운드에 베팅이 있다. 라운드 식별자가 인스턴스 토큰을 담으므로 재시작
  #                뒤의 재시도는 반드시 다른 round_id를 들고 오고, 저장소는 같은 request_id의
  #                다른 요청 지문을 DUPLICATE_REQUEST_CONFLICT로 거절한다.
  #   PHASE_DENIED 새 라운드가 이미 OPEN을 벗어났다.
  # 어느 쪽이든 두 번째 추첨·엔트로피 소비·정산은 일어나지 않는다.
  after_restart_behavior: FAIL_CLOSED
  after_restart_refusal_codes:
    - NO_BETS
    - DRAW_DENIED
    - PHASE_DENIED
  # 저장소 재생 분기가 내는 코드. 같은 round_id로 재제출되어야 도달하는데, 라운드 식별자가
  # 프로세스마다 다른 토큰을 담으므로 재시작 경로에서는 도달하지 않는다. 도달하지 않는 코드를
  # 재시작 거절 코드로 적어 두는 것은 사실이 아니므로 분리해 기록한다.
  store_replay_refusal_code: REQUEST_ID_ALREADY_USED
  store_replay_reachable_after_restart: false
  store_replay_unreachable_reason: >-
    apps.roulette_web.table.RouletteTable가 라운드 식별자에 인스턴스 토큰을 넣기 때문에
    재시작 뒤 재시도는 항상 다른 round_id를 제시하고, 저장소는 재생 대신 지문 충돌로 거절한다.
  # 클라이언트는 유실 복구 경로 안에서만 이 셋을 같은 신호로 읽는다: '이 서버는 네가 돌리던
  # 라운드를 들고 있지 않다.' 일반 경로에서는 각각 원래 의미 그대로 사용자에게 보인다.
  client_treats_refusal_as_recovery_signal: true
  second_draw: prohibited
  second_entropy_consumption: prohibited
  second_ledger_settlement: prohibited
  balance_moves_on_retry: prohibited
  committed_outcome_observable_via: GET /api/state recent_results
  # 열린 라운드의 베팅은 내구화되지 않으므로 재시작 뒤 per-bet 내역은 복구되지 않는다.
  # 그럴듯한 재구성 대신 없음을 선언한다. 확장은 R2-DBC-0002 스키마 결정에 종속된다.
  per_bet_outcomes_recoverable_after_restart: false

preserved_boundaries:
  # 이 유닛이 건드리지 않고 그대로 두는 것들. 값은 구현 상수에서 읽어 대조한다.
  bind: loopback_only
  runtime: python3.11+ standard library only
  build_step: none
  node_or_npm_required: false
  external_cdn_assets: none
  currency_units: integer_minimum_units_only
  floating_point_currency: prohibited
  routes_source: apps.roulette_web.server.ROUTES
  route_count: 4
  security_headers_source: apps.roulette_web.server.SECURITY_HEADERS
  security_header_count: 7
  rules_changed: false
  payout_schedule_changed: false
  rng_algorithm_changed: false
  ledger_semantics_changed: false
  asset_or_image_paths_changed: false

frozen_paths:
  # 변경 시 이 유닛의 범위를 넘는 무결성 재고정 연쇄를 일으키는 파일. tasks/R2-NET-0003.json이
  # 해시로 고정하며, validate_r2_reconnect가 그 해시를 실제 파일과 대조한다.
  reason: >-
    아래 경로는 tasks/R4-ART-0007.json 또는 그 선행 계약이 해시로 고정하고 있어, 변경하면
    R4-ART-0007 메타데이터까지 재고정해야 한다. 그것은 이 유닛의 범위 밖이다.
  paths:
    - apps/roulette_web/server.py
    - apps/roulette_web/table.py
    - games/roulette/playable-slice-contract.yaml
    - docs/status/R2-STATUS.md
    - apps/roulette_web/static/index.html
    - apps/roulette_web/static/styles.css
    - tests/test_roulette_web_server.py
    - tests/test_roulette_web_ui.py
    - tasks/R4-ART-0007.json

repin_scope:
  # scripts/validate_baseline.py 변경이 강제하는 해시 재고정. 해시 한 줄 외에는 바꾸지 않는다.
  # 이 블록은 검증기 해시 하나만 다룬다. AC-010이 승인한 전체 메타데이터 폐포는 아래
  # full_metadata_closure에 있으며, validate_r2_reconnect는 이 블록을 실제로 검증기를
  # 입력으로 고정하는 계약 집합과 대조한다.
  reason: scripts/validate_baseline.py를 입력으로 고정하는 계약이 세 건 존재한다.
  target: scripts/validate_baseline.py
  contracts:
    - tasks/SYS-AST-0014.json
    - tasks/SYS-CI-0012.json
    - tasks/SYS-QA-0015.json
  reaches_r4_art_0007: false

full_metadata_closure:
  # AC-010이 승인한 메타데이터 수정의 전부. 각 항목은 해시 값 한 줄이며 다른 필드는 바꾸지
  # 않는다. app.js가 이 유닛의 산출물이라는 사실에서 두 번째 종류가 나왔다:
  # artifacts/R4-UI-0006-artifact.json이 component_hash 키로 그 파일을 고정한다.
  authorized_by: Codex REWORK authorization, 2026-09-02
  hash_values_only: true
  other_fields_modifiable: false
  entries:
    - file: tasks/SYS-AST-0014.json
      field: inputs[repo://scripts/validate_baseline.py].content_hash
    - file: tasks/SYS-CI-0012.json
      field: inputs[repo://scripts/validate_baseline.py].content_hash
    - file: tasks/SYS-QA-0015.json
      field: inputs[repo://scripts/validate_baseline.py].content_hash
    - file: tasks/SYS-QA-0015.json
      field: inputs[repo://artifacts/R4-UI-0006-artifact.json].content_hash
    - file: artifacts/R4-UI-0006-artifact.json
      field: specification["component_hash:apps/roulette_web/static/app.js"]
  terminal: true
  reaches_r4_art_0007: false
  reference_kinds_traced:
    - inputs[].uri
    - artifact.uri
    - specification component_hash keys

out_of_scope:
  - 다중 사용자 신원, 세션 분리, 로그인, 계정, 개인정보는 이 유닛이 도입하지 않는다.
  - R2-LOAD-0004 부하·처리량·SLO는 이 유닛이 닫지 않고 열린 채로 이월된다.
  - R2-SEC-0005 보안 침투 시험은 이 유닛이 닫지 않고 열린 채로 이월된다.
  - 운영 환경 배포, 외부 네트워킹, 루프백 밖 노출은 범위 밖이다.
  - 환전, 현금 인출, 결제, 실물 보상, 수익화 경로는 존재하지 않는다.
  - R5 승인 전이므로 상용 제작 일정과 출시일을 확정하지 않는다.
