notes:
  - 이 증거는 codex_imagegen의 image 능력 활성화 근거이며 codex_primary 활성화 근거가 아니다.
  - PRB-001과 PRB-002의 이미지는 Codex 관리형 콘솔에서 실행되어 사용자가 보고한 결과이며,
    저장소에는 이미지 파일이 아니라 픽셀 크기·바이트 수·SHA-256 지문만 남는다.
  - 두 산출물은 등록 이전 연결 확인용 프로브 또는 후보 자산이며 Artifact Contract의 정식
    산출물이나 프로덕션 승인 증거로 승격하지 않는다.
  - credential_source 열거에는 관리형 앱 전용 값이 없어 스키마가 허용하는
    PROVIDER_NATIVE_AUTH_STORE로 기록하고, 실제 저장 위치는 registry.yaml의
    managed_credential_storage=managed_workspace_auth로 남긴다.
open_decisions:
  - Layer AI 연결은 아트 사용량이 증가한 시점에 사용자와 A-00이 별도로 판단하며, 이 증거는
    사용량 임계값·전환 기준·일정을 확정하지 않는다.
  - 관리형 내장 ImageGen의 모델 이름·버전과 과금 사용량 기록 방식은 후속 작업에서 확정한다.
  - 프로브 산출 이미지의 후보 자산 보관 위치와 폐기 기준은 A-30과 후속 작업에서 결정한다.
