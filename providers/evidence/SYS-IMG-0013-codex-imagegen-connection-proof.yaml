      PNG의 픽셀 크기·바이트 수·SHA-256을 기록한다.
    blocking: true
    result: PASS
    observed: >-
      1254x1254 PNG 2,739,931 바이트를 성공적으로 수신했다. SHA-256은
      920861ca200bb0ed8b273bb78a8acfd235e42cf392ac3c24eadcebc32bad0e62 이다. 산출물은 등록
      이전 연결 확인용 프로브이며 프로덕션 자산이 아니다.
    evidence_uri: repo://docs/providers/SYS-IMG-0013-codex-imagegen-art-provider.md#probe-b
  - probe_id: PRB-003
    name: 관리형 인증 비노출 확인
    method: >-
      두 생성 호출에 별도 API 키·토큰 입력이 필요했는지 확인하고, 저장소에 남는 자격 증명
