    blocking: true
    result: PASS
    observed: >-
      별도 키 발급이나 값 입력 없이 관리형 작업 공간 인증으로 호출이 성립했다. 저장소에는
      secret-ref://providers/codex-imagegen 참조와 managed_workspace_auth 저장 위치 표기만
      남고 비밀값은 어디에도 기록되지 않았다.
    evidence_uri: repo://providers/registry.yaml
  - probe_id: PRB-004
    name: 능력 경계 확인
    method: >-
      새 공급자 항목의 capabilities와 라우팅 정책을 읽어 image 외 능력이 부여되지 않았고
      codex_primary 상태와 코드·추론·평가 라우트가 그대로인지 확인한다.
    blocking: true
    result: PASS
    observed: >-
      codex_imagegen은 capabilities [image]만 선언하고 code·reasoning·evaluation·
      orchestration을 갖지 않는다. codex_primary는 DISABLED와
      user_selected_claude_only_programming 사유를 유지하며 어떤 라우트에도 없고, code·
      reasoning·evaluation 라우트는 preferred=claude_agent, fallbacks=[] 그대로다.
